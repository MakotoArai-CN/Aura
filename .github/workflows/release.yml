name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION_NUM=$(node -p "require('./package.json').version")
          VERSION="v${VERSION_NUM}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_num=${VERSION_NUM}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisPath "makensis.exe"
          if (!(Test-Path $makensis)) {
            throw "NSIS installation failed: makensis.exe not found."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bunx svelte-check

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  build-windows-webview2:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: downloadBootstrapper
            suffix: webview2
          - mode: offlineInstaller
            suffix: webview2-offline
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisPath "makensis.exe"
          if (!(Test-Path $makensis)) {
            throw "NSIS installation failed: makensis.exe not found."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure WebView2 mode
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName "webviewInstallMode" -NotePropertyValue @{ type = "${{ matrix.mode }}" } -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content "src-tauri/tauri.conf.json"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Collect WebView2 installer
        shell: pwsh
        run: |
          $artifactDir = "webview2-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Get-ChildItem "src-tauri/target" -Recurse -File -Filter "*.exe" |
            Where-Object { $_.FullName -like "*\release\bundle\nsis\*" } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination (Join-Path $artifactDir ($_.BaseName + "-${{ matrix.suffix }}" + $_.Extension)) -Force
            }
          if ((Get-ChildItem $artifactDir -File).Count -eq 0) { throw "No WebView2 installer generated." }

      - name: Upload WebView2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suffix }}
          path: webview2-${{ matrix.suffix }}/*.exe
          if-no-files-found: error

  # === PLACEHOLDER_REST ===

  build-linux:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure Linux bundle targets
        run: |
          jq '.bundle.targets = ["deb", "rpm", "appimage"]' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # === PLACEHOLDER_ANDROID ===

  build-android:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project
        run: bun run tauri:android:init

      # tauri android init 铺的是模板自带的默认图标，src-tauri/icons/android 里项目自己的
      # mipmap 从来没被用上，装出来的 APK 图标一直是 Tauri 的默认图案。
      - name: Copy Android icons
        run: |
          ANDROID_RES="src-tauri/gen/android/app/src/main/res"
          ICON_SRC="src-tauri/icons/android"

          if [ ! -d "$ICON_SRC" ]; then
            echo "::error::$ICON_SRC 不存在，APK 会退回 Tauri 默认图标"
            exit 1
          fi

          for dir in "$ICON_SRC"/mipmap-* "$ICON_SRC"/values; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            mkdir -p "$ANDROID_RES/$dirname"
            cp -rf "$dir"/* "$ANDROID_RES/$dirname/"
          done

          ls -R "$ANDROID_RES"/mipmap-anydpi-v26 "$ANDROID_RES"/mipmap-xxxhdpi

      - name: Setup Android signing
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，签不了名的 APK 装不上"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties << 'PROPS'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release.jks
          PROPS

      # 光有 keystore.properties 和 release.jks 没用：tauri android init 生成的
      # app/build.gradle.kts 里根本没有 signingConfigs，release 变体不引用任何签名配置，
      # 打出来的是未签名 APK —— Android 直接拒绝安装，也就是"没有签名、打不开"。
      # 这里整份覆盖，把 release 变体接到 keystore.properties 上。
      - name: Apply custom build.gradle.kts
        run: |
          cat > src-tauri/gen/android/app/build.gradle.kts << 'GRADLE_EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("rust")
          }

          val tauriProperties = Properties().apply {
              val propFile = file("tauri.properties")
              if (propFile.exists()) {
                  propFile.inputStream().use { load(it) }
              }
          }

          android {
              compileSdk = 36
              namespace = "com.makotoarai.aura"
              defaultConfig {
                  manifestPlaceholders["usesCleartextTraffic"] = "true"
                  applicationId = "com.makotoarai.aura"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = tauriProperties.getProperty("tauri.android.versionCode", "1").toInt()
                  versionName = tauriProperties.getProperty("tauri.android.versionName", "1.0")
              }
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }

                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
              buildTypes {
                  getByName("debug") {
                      manifestPlaceholders["usesCleartextTraffic"] = "true"
                      isDebuggable = true
                      isJniDebuggable = true
                      isMinifyEnabled = false
                      packaging {
                          jniLibs.keepDebugSymbols.add("*/arm64-v8a/*.so")
                          jniLibs.keepDebugSymbols.add("*/armeabi-v7a/*.so")
                          jniLibs.keepDebugSymbols.add("*/x86/*.so")
                          jniLibs.keepDebugSymbols.add("*/x86_64/*.so")
                      }
                  }
                  getByName("release") {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          *fileTree(".") { include("**/*.pro") }
                              .plus(getDefaultProguardFile("proguard-android-optimize.txt"))
                              .toList().toTypedArray()
                      )
                  }
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
              buildFeatures {
                  buildConfig = true
              }
          }

          rust {
              rootDirRel = "../../../"
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.14.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("com.google.android.material:material:1.12.0")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.1.4")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.5.0")
          }

          apply(from = "tauri.build.gradle.kts")
          GRADLE_EOF

      - name: Build Android APK
        run: bun run tauri:android:build -- --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Universal APK
        run: bun run tauri:android:build
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Collect and rename APKs
        run: |
          mkdir -p android-apks
          find src-tauri/gen/android -path "*/release/*.apk" -type f | while read apk; do
            filename=$(basename "$apk")
            # 签名开启后同一目录里可能同时留着中间产物 *-unsigned.apk，别把它当成品收走。
            if [[ "$filename" == *"unsigned"* ]]; then
              continue
            fi
            if [[ "$filename" == *"arm64"* ]]; then
              cp "$apk" "android-apks/aura-android-arm64.apk"
            elif [[ "$filename" == *"arm"* ]]; then
              cp "$apk" "android-apks/aura-android-arm.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" "android-apks/aura-android-x86_64.apk"
            elif [[ "$filename" == *"x86"* ]] && [[ "$filename" != *"x86_64"* ]]; then
              cp "$apk" "android-apks/aura-android-x86.apk"
            elif [[ "$filename" == *"universal"* ]] || [[ "$filename" != *"-"* ]]; then
              cp "$apk" "android-apks/aura-android-universal.apk"
            fi
          done
          ls -la android-apks/

      # v1.0.2 装得上但一开就退：libaura_lib.so 的 PT_LOAD 段是 4 KB 对齐，而清单里
      # extractNativeLibs=false，.so 由 linker 直接从 APK mmap。16 KB 页的 Android 15/16
      # 设备映射不了 4 KB 粒度的段，dlopen 失败，进程死在加载原生库那一步。
      # src-tauri/.cargo/config.toml 已经加了链接参数，这一步是防回归的硬闸：对齐不达标
      # 就让流水线红掉，别再让同样装不了的包发出去。
      - name: Verify 16 KB page alignment
        run: |
          python3 - <<'PY'
          import glob, struct, sys, zipfile

          bad = []
          for apk in sorted(glob.glob("android-apks/*.apk")):
              with zipfile.ZipFile(apk) as z:
                  libs = [n for n in z.namelist()
                          if n.startswith(("lib/arm64-v8a/", "lib/x86_64/")) and n.endswith(".so")]
                  if not libs:
                      print(f"{apk}: 无 64 位原生库，跳过")
                      continue
                  for name in libs:
                      blob = z.read(name)
                      if blob[:4] != b"\x7fELF":
                          bad.append((apk, name, "不是 ELF"))
                          continue
                      phoff = struct.unpack_from("<Q", blob, 0x20)[0]
                      phentsize = struct.unpack_from("<H", blob, 0x36)[0]
                      phnum = struct.unpack_from("<H", blob, 0x38)[0]
                      aligns = []
                      for i in range(phnum):
                          o = phoff + i * phentsize
                          if struct.unpack_from("<I", blob, o)[0] == 1:  # PT_LOAD
                              aligns.append(struct.unpack_from("<Q", blob, o + 48)[0])
                      worst = min(aligns) if aligns else 0
                      ok = worst >= 16384
                      print(f"{apk}: {name} 最小 p_align={worst} ({worst // 1024} KB) "
                            f"{'OK' if ok else '不达标'}")
                      if not ok:
                          bad.append((apk, name, f"p_align={worst}"))

          if bad:
              for apk, name, why in bad:
                  print(f"::error::{apk} 的 {name} 未按 16 KB 页对齐（{why}），"
                        f"在 16 KB 页设备上会 dlopen 失败、装上打不开")
              sys.exit(1)
          print("全部 64 位原生库均已按 16 KB 页对齐")
          PY

      # 别再让未签名的 APK 混进 Release：装不上的包发出去等于没发。
      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in android-apks/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android-apks/*.apk

  # === PLACEHOLDER_RELEASE ===

  release:
    needs: [get-version, build-windows, build-windows-webview2, build-linux, build-macos, build-android]
    if: needs.get-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts found"

      # 发布页给出校验值，用户下完能自己核对完整性。
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.apk" \) \
            -exec sha256sum {} + | sed 's|\./[^ ]*/||' | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s (%h)" | head -50)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --pretty=format:"- %s (%h)")
          fi
          COMMITS=$(echo "$COMMITS" | sed 's/@\([a-zA-Z0-9_-]*\)/`@\1`/g')

          VERSION="${{ needs.get-version.outputs.version }}"
          VERSION_NUM="${{ needs.get-version.outputs.version_num }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
          SHIELD="https://img.shields.io/badge"
          STYLE="style=for-the-badge"

          {
            echo "body<<EOF"
            echo '<div align="center">'
            echo ""
            echo "<img src='https://raw.githubusercontent.com/${REPO}/${VERSION}/src-tauri/icons/128x128%402x.png' width='96' alt='Aura' />"
            echo ""
            echo "# Aura ${VERSION}"
            echo ""
            echo "**One for all free music** — 聚合多源的免费音乐播放器"
            echo ""
            echo "[![release](https://img.shields.io/github/v/release/${REPO}?${STYLE}&logo=github&label=release&color=8b5cf6)](https://github.com/${REPO}/releases/latest) [![downloads](https://img.shields.io/github/downloads/${REPO}/total?${STYLE}&logo=github&label=downloads&color=22c55e)](https://github.com/${REPO}/releases) [![stars](https://img.shields.io/github/stars/${REPO}?${STYLE}&logo=github&color=eab308)](https://github.com/${REPO}/stargazers) [![license](https://img.shields.io/github/license/${REPO}?${STYLE}&color=64748b)](https://github.com/${REPO}/blob/master/LICENSE)"
            echo ""
            echo "![Tauri](${SHIELD}/Tauri-2-24C8DB?${STYLE}&logo=tauri&logoColor=white) ![Svelte](${SHIELD}/Svelte-5-FF3E00?${STYLE}&logo=svelte&logoColor=white) ![Rust](${SHIELD}/Rust-000000?${STYLE}&logo=rust&logoColor=white) ![TypeScript](${SHIELD}/TypeScript-3178C6?${STYLE}&logo=typescript&logoColor=white)"
            echo ""
            echo '</div>'
            echo ""
            echo "## 更新日志"
            echo ""
            echo "$COMMITS"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "完整差异：[\`${PREV_TAG}...${VERSION}\`](https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION})"
              echo ""
            fi
            echo "---"
            echo ""
            echo "## 下载"
            echo ""
            echo "### Windows"
            echo ""
            echo "| 下载 | 适用 |"
            echo "|:----:|:-----|"
            W="${SHIELD}/Windows"
            WQ="${STYLE}&logo=windows&logoColor=white"
            echo "| [![Windows x64](${W}-x64-0078D6?${WQ})](${BASE_URL}/Aura_${VERSION_NUM}_x64-setup.exe) | 绝大多数 Windows 10/11 设备，首选 |"
            echo "| [![Windows x86](${W}-x86-0078D6?${WQ})](${BASE_URL}/Aura_${VERSION_NUM}_x86-setup.exe) | 32 位系统 |"
            echo "| [![Windows ARM64](${W}-ARM64-0078D6?${WQ})](${BASE_URL}/Aura_${VERSION_NUM}_arm64-setup.exe) | 骁龙等 ARM 设备 |"
            echo "| [![WebView2](${W}-WebView2-0078D6?${WQ})](${BASE_URL}/Aura_${VERSION_NUM}_x64-setup-webview2.exe) | 缺少 WebView2 运行时，安装时联网补齐 |"
