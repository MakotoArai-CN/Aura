[package]
name = "aura"
version = "1.0.4"
description = "One for all free music"
authors = ["MakotoArai"]
license = "MIT"
repository = "https://github.com/MakotoArai-CN/Aura"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：main 和 float 两个窗口都开了 transparent，而 macOS 上
# 透明窗口走的是私有 API，不开这个 feature 连 .transparent() 方法都不存在
# （E0599）。代价是用了私有 API 的包上不了 Mac App Store，自行分发不受影响。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "zstd", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
urlencoding = "2"
lofty = "0.22.4"
base64 = "0.22"
encoding_rs = "0.8"
sysinfo = "0.33"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 轻量模式（零 WebView 的原生迷你播放器）用到的系统接口：
# Direct2D/DirectWrite/WIC 自绘界面。解码与输出已改成 rodio + symphonia
# （见 mini/shared/rodio_backend.rs），所以不再需要 Media_Core / Media_Playback；
# 但换掉 MediaPlayer 之后媒体键、音量 OSD、锁屏曲目信息都得自己接，
# 于是多出 Media / Storage_Streams / Win32_System_WinRT 三项供 mini/smtc.rs 用。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Foundation",
  "Media",
  "Storage_Streams",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
