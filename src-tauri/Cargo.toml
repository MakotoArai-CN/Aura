[package]
name = "aura"
version = "1.0.2"
description = "One for all free music"
authors = ["MakotoArai"]
license = "MIT"
repository = "https://github.com/MakotoArai-CN/Aura"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "zstd", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
urlencoding = "2"
lofty = "0.22.4"
base64 = "0.22"
encoding_rs = "0.8"
sysinfo = "0.33"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 轻量模式（零 WebView 的原生迷你播放器）用到的系统接口：
# Direct2D/DirectWrite/WIC 自绘界面，WinRT MediaPlayer 交给系统解码与输出。
# 这些都是系统自带的，不额外增加运行时依赖。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Foundation",
  "Media_Core",
  "Media_Playback",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
